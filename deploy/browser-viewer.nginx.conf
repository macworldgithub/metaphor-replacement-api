# Include inside the automation domain's existing HTTPS server block.
# Authentication protects BOTH the HTML viewer and its WebSocket transport.
location /browser/ {
    auth_basic "Cranbourne automation browser";
    auth_basic_user_file /etc/nginx/cranbourne-viewer.htpasswd;
    proxy_pass http://127.0.0.1:6080/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
}
