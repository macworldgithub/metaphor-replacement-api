[Unit]
Requires=cranbourne-display.service
After=cranbourne-display.service

[Service]
# Fixed display shared with noVNC, replacing xvfb-run's random display.
Environment=DISPLAY=:99
ExecStart=
ExecStart=/var/www/cranbourne/current/automation/.venv/bin/python /var/www/cranbourne/current/automation/run_connector.py
PrivateTmp=false
